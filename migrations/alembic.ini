# A generic, single database configuration.

[alembic]
# template used to generate migration files; the date prefix keeps
# `ls migrations/versions` in creation order (the revision chain itself is
# defined by down_revision inside each file, not by the file name)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false


[post_write_hooks]
# format every newly generated migration with Black (config from pyproject.toml)
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -q REVISION_SCRIPT_FILENAME


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic,flask_migrate

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_flask_migrate]
level = INFO
handlers =
qualname = flask_migrate

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
